# Static site for Cloudflare Workers (Git deploy).
# Build copies public files into dist/ so .git is never uploaded.

name = "poke-pack"
compatibility_date = "2026-08-21"

[build]
command = "node scripts/prepare-cf-assets.mjs"

[assets]
directory = "./dist"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
