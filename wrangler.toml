# Worker + static assets for Cloudflare (Git deploy).
# Build copies public files into dist/ so .git is never uploaded.

name = "poke-pack"
main = "worker/index.js"
compatibility_date = "2026-08-21"

[build]
command = "node scripts/prepare-cf-assets.mjs"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
run_worker_first = true

# Ambient population. The tick is a no-op unless BOT_SECRET is set, so put it
# in only where you actually want bots:
#   wrangler secret put BOT_SECRET
[triggers]
crons = ["* * * * *"]

[vars]
SITE_ORIGIN = "https://poke-pack.rip"

[[d1_databases]]
binding = "DB"
database_name = "poke-pack"
database_id = "f8eceab0-2f6b-406a-9341-075920325daa"
migrations_dir = "worker/migrations"
