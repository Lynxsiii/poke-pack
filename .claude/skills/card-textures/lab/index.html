<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Foil lab</title>
  <!-- The site's own sheets, in index.html's order, so the lab paints exactly
       what the site paints. lab.css comes last and only acts inside
       .lab-proof cells. Serve from the repo root (python3 scripts/serve.py)
       and open /.claude/skills/card-textures/lab/. -->
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/card-displays.css" />
  <link rel="stylesheet" href="/css/holo/windows.css" />
  <link rel="stylesheet" href="/css/holo/base.css" />
  <link rel="stylesheet" href="/css/holo/rarities.css" />
  <link rel="stylesheet" href="/css/holo/finishes.css" />
  <link rel="stylesheet" href="/css/holo/realism.css" />
  <link rel="stylesheet" href="/css/holo/maps.css" />
  <link rel="stylesheet" href="/css/holo/celebration.css" />
  <link rel="stylesheet" href="/css/holo/sv-fullart.css" />
  <link rel="stylesheet" href="/css/holo/promos.css" />
  <link rel="stylesheet" href="/css/holo/sv-finishes.css" />
  <link rel="stylesheet" href="/css/holo/sv-rare.css" />
  <link rel="stylesheet" href="/css/holo/shrouded-fable.css" />
  <link rel="stylesheet" href="/css/holo/shiny-vault.css" />
  <link rel="stylesheet" href="/css/holo/prismatic.css" />
  <link rel="stylesheet" href="./lab.css" />
  <style>
    body { margin: 0; padding: 24px; background: #0e0f11; color: #c9c9c4; font: 13px/1.4 system-ui, sans-serif; }
    .lab-row + .lab-row { margin-top: 28px; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, .08); }
    .lab-row h2 { margin: 0 0 14px; font: 500 11px/1 ui-monospace, monospace; letter-spacing: .06em; text-transform: uppercase; color: #9d9fa6; }
    .lab-cards { display: flex; flex-wrap: wrap; gap: 24px 16px; align-items: flex-start; }
    .lab-cell { margin: 0; width: var(--w); }
    .lab-cell .tcg { width: 100%; }
    .lab-cell figcaption { margin-top: 12px; color: #9d9fa6; font: 11px/1.35 ui-monospace, monospace; }
    .lab-site + .lab-proof { margin-right: 24px; }
  </style>
</head>
<body class="fx-holo">
  <main id="grid"></main>
  <script type="module" src="./lab.js"></script>
</body>
</html>
